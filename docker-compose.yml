services:
  postgres:
    image: postgres:16
    container_name: simpel-adu-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - simpel-network

  ai:
    build:
      context: ./AI
      dockerfile: Dockerfile

    container_name: simpel-adu-ai
    restart: unless-stopped

    ports:
      - "8000:8000"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('localhost', 8000), 2); s.close()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - simpel-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile

    container_name: simpel-adu-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_started

    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      AI_SERVICE: ${AI_SERVICE}
      PORT: ${PORT}

    ports:
      - "8080:8080"

    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - simpel-network

  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile

    container_name: simpel-adu-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "5173:80"

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - simpel-network

volumes:
  postgres_data:

networks:
  simpel-network:
    driver: bridge
