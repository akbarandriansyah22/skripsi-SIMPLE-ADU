services:
  postgres:
    image: postgres:16
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - simpel-network

  ai:
    build:
      context: ./AI
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "${AI_HOST_PORT:-8000}:8000"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - simpel-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_healthy

    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-change_me_demo_password}
      AI_SERVICE: http://ai:8000
      PORT: "8080"
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}

    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - simpel-network

    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - simpel-network

volumes:
  postgres_data:
    name: simpel_adu_postgres_data
  uploads_data:
    name: simpel_adu_uploads_data


networks:
  simpel-network:
    driver: bridge
